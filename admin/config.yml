# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: Violet-7F00FF/Violet-7F00FF.github.io
  branch: main

# 올린 사진과 음악이 저장되는 곳
media_folder: /media
public_folder: /media

# 사진 올릴 때 자동 처리 (공식 문서 형식)
media_libraries:
  default:
    config:
      # 파일 이름을 영문/숫자로 정리
      slugify_filename: true
      # 한 파일 최대 8MB
      max_file_size: 8000000
      transformations:
        # 사진을 webp 로 다시 저장 → 파일에 붙은 정보가 사라집니다
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800
        svg:
          optimize: true

collections:
  # ---------- 글 ----------
  - name: blog
    label: 글
    icon: article
    files:
      - name: posts
        label: 글 목록
        file: data/posts.json
        fields:
          - name: posts
            label: 글
            label_singular: 글
            widget: list
            summary: '{{fields.date}}  {{fields.title}}'
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: date, label: 날짜, widget: datetime, type: date }
              - { name: tag, label: 태그, widget: string, required: false }
              - { name: cover, label: 대표 이미지, widget: image, required: false }
              - { name: body, label: 본문, widget: richtext }

  # ---------- 갤러리 ----------
  - name: gallery
    label: 갤러리
    icon: image
    files:
      - name: items
        label: 그림 목록
        file: data/gallery.json
        fields:
          - name: items
            label: 그림
            label_singular: 그림
            widget: list
            summary: '{{fields.caption}}'
            fields:
              - { name: image, label: 그림, widget: image }
              - { name: caption, label: 설명, widget: string, required: false }

  # ---------- 음악 ----------
  - name: music
    label: 음악
    icon: music_note
    files:
      - name: tracks
        label: 재생 목록
        file: data/music.json
        fields:
          - name: tracks
            label: 노래
            label_singular: 노래
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: title, label: 제목, widget: string }
              - { name: artist, label: 아티스트, widget: string, required: false }
              - { name: youtube, label: 유튜브 주소, widget: string, required: false, hint: '주소를 그대로 붙여넣으세요. 이걸 넣으면 아래 파일은 안 써도 됩니다' }
              - { name: file, label: 음악 파일 (mp3), widget: file, required: false }

  # ---------- 공지 ----------
  - name: notice
    label: 공지
    icon: campaign
    files:
      - name: notice
        label: 공지 창
        file: data/notice.json
        fields:
          - { name: top_label, label: 맨 위 작은 라벨, widget: string, required: false, default: WELCOME, hint: '비워두면 안 나옵니다' }
          - { name: top_note, label: 라벨 옆 도트 글씨, widget: string, required: false }
          - { name: intro_heading, label: 프로필 소제목, widget: string, required: false, default: 프로필 }
          - { name: intro, label: 프로필 소개글, widget: text, required: false }
          - { name: twitter_id, label: 트위터 아이디, widget: string, required: false, hint: '예) @Cookie_B_A' }
          - { name: twitter_url, label: 트위터 주소, widget: string, required: false, hint: 'https://x.com/아이디' }
          - &blocks
            name: blocks
            label: 항목
            label_singular: 항목
            widget: list
            hint: '+ 를 눌러 원하는 종류의 항목을 추가하세요. 손잡이를 끌면 순서가 바뀝니다.'
            types:
              - name: text
                label: 글
                summary: '글 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - { name: body, label: 내용, widget: richtext }
              - name: tags
                label: 태그 묶음
                summary: '태그 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - { name: tags, label: 태그, widget: string, hint: '쉼표로 구분. 예) 현대물, 학원물' }
                  - { name: color, label: 색, widget: select, required: false, options: [pink, cyan, mint, yellow, peach, grape] }
              - name: callout
                label: 노란 상자
                summary: '상자 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - { name: body, label: 내용, widget: richtext }
              - name: label
                label: 작은 라벨
                summary: '라벨 · {{fields.text}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: text, label: 내용, widget: string }
              - name: code
                label: 복사되는 상자
                summary: '상자 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - { name: filename, label: 상자 이름, widget: string, required: false }
                  - { name: code, label: 내용, widget: text }
              - name: folds
                label: 접히는 목록
                summary: '접기 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - name: items
                    label: 항목
                    label_singular: 항목
                    widget: list
                    summary: '{{fields.title}}'
                    fields:
                      - { name: title, label: 제목, widget: string }
                      - { name: body, label: 내용, widget: richtext }
              - name: cards
                label: 작은 카드
                summary: '카드 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - name: items
                    label: 카드
                    label_singular: 카드
                    widget: list
                    summary: '{{fields.name}}'
                    fields:
                      - { name: name, label: 이름, widget: string }
                      - { name: meta, label: 부가 정보, widget: string, required: false }
                      - { name: desc, label: 설명, widget: string, required: false }
              - name: cps
                label: CP 카드
                summary: 'CP · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - name: items
                    label: CP
                    label_singular: CP
                    widget: list
                    summary: '{{fields.name}}'
                    fields:
                      - { name: name, label: CP 이름, widget: string }
                      - { name: work, label: 작품 이름, widget: string, required: false }
                      - { name: pair, label: 페어명, widget: string, required: false, hint: 'CP 이름 옆 네모 박스에 들어갑니다' }
                      - { name: dday, label: 디데이 기준 날짜, widget: datetime, type: date, required: false, hint: '이 날짜부터 며칠 지났는지 D+0000 으로 나옵니다' }
                      - { name: dday_label, label: 디데이 앞에 붙일 말, widget: string, required: false, hint: '예) 함께한 지' }
                      - { name: badge, label: 배지, widget: select, options: [MAIN, SUB, 관심], default: SUB }
                      - { name: color, label: 카드 색, widget: select, options: [pink, cyan, mint, peach, yellow, grape, coral, sky, sage, cream, rose, ice], default: pink }
                      - { name: tags, label: 태그, widget: string, required: false, hint: '쉼표로 구분' }
                      - name: images
                        label: 사진 (최대 3장)
                        label_singular: 사진
                        widget: list
                        required: false
                        max: 3
                        fields:
                          - { name: image, label: 사진, widget: image }
                          - { name: caption, label: 설명, widget: string, required: false }
                      - { name: note, label: 설명 (CP 이름 아래), widget: text, required: false }
              - name: images
                label: 사진 나열
                summary: '사진 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - name: items
                    label: 사진
                    label_singular: 사진
                    widget: list
                    fields:
                      - { name: image, label: 사진, widget: image }
                      - { name: caption, label: 설명, widget: string, required: false }
              - name: promptcard
                label: 프롬프트 카드 (사진 + 복사)
                summary: '프롬프트 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 제목, widget: string }
                  - { name: desc, label: 설명, widget: richtext, required: false }
                  - name: images
                    label: 사진 (최대 3장)
                    label_singular: 사진
                    widget: list
                    required: false
                    max: 3
                    fields:
                      - { name: image, label: 사진, widget: image }
                      - { name: caption, label: 설명, widget: string, required: false }
                  - { name: filename, label: 복사 상자 이름, widget: string, required: false }
                  - { name: code, label: 프롬프트 내용 (복사됨), widget: text }
              - name: widget
                label: 위젯 (미리보기 + 링크)
                summary: '위젯 · {{fields.name}}'
                fields:
                  - { name: name, label: 위젯 이름, widget: string, hint: '위쪽 태그 버튼 이름이 됩니다' }
                  - { name: meta, label: 부가 정보, widget: string, required: false, hint: '예) 2026.07 · 8색' }
                  - { name: image, label: 미리보기 사진, widget: image, required: false }
                  - { name: desc, label: 설명, widget: text, required: false }
                  - { name: link, label: 공유 링크, widget: string, required: false }
              - name: personas
                label: 페르소나 카드
                summary: '페르소나 · {{fields.heading}}'
                fields:
                  - { name: tag, label: 분류(태그), widget: string, required: false, hint: '위쪽 태그 버튼으로 묶입니다. 비워두면 항상 보입니다' }
                  - { name: heading, label: 소제목, widget: string, required: false }
                  - name: items
                    label: 페르소나
                    label_singular: 페르소나
                    widget: list
                    summary: '{{fields.name}}'
                    fields:
                      - { name: name, label: 이름, widget: string }
                      - { name: realname, label: 본명, widget: string, required: false, hint: '이름 옆에 작은 기울임 글씨로 나옵니다' }
                      - { name: quote, label: 캐릭터의 한 마디, widget: string, required: false, hint: '본명 옆에 따옴표로 나옵니다' }
                      - { name: note, label: 설명 (이름 아래), widget: text, required: false }
                      - { name: spec, label: 간단 설정, widget: text, required: false, hint: '태그 위 색 네모 칸에 들어갑니다' }
                      - { name: spec_color, label: 간단 설정 색, widget: select, required: false, options: [pink, cyan, mint, peach, yellow, grape, coral, sky, sage, cream, rose, ice], default: mint }
                      - { name: tags, label: 태그, widget: string, required: false, hint: '쉼표로 구분' }
                      - name: images
                        label: 사진 (최대 3장)
                        label_singular: 사진
                        widget: list
                        required: false
                        max: 3
                        fields:
                          - { name: image, label: 사진, widget: image }
                          - { name: caption, label: 설명, widget: string, required: false }
                      - { name: prompt, label: 프롬프트, widget: text, required: false }

  # ---------- 파는 CP ----------
  - name: taste
    label: 파는 CP
    icon: favorite
    files:
      - name: taste
        label: 파는 CP 창
        file: data/taste.json
        fields:
          - { name: top_label, label: 맨 위 작은 라벨, widget: string, required: false, hint: '비워두면 안 나옵니다' }
          - { name: top_note, label: 라벨 옆 도트 글씨, widget: string, required: false }
          - { name: intro_heading, label: 소개글 소제목, widget: string, required: false }
          - { name: intro, label: 소개글, widget: text, required: false }
          - *blocks

  # ---------- 페르소나 ----------
  - name: persona
    label: 페르소나
    icon: person
    files:
      - name: persona
        label: 페르소나 창
        file: data/persona.json
        fields:
          - { name: top_label, label: 맨 위 작은 라벨, widget: string, required: false, hint: '비워두면 안 나옵니다' }
          - { name: top_note, label: 라벨 옆 도트 글씨, widget: string, required: false }
          - { name: intro_heading, label: 소개글 소제목, widget: string, required: false }
          - { name: intro, label: 소개글, widget: text, required: false }
          - *blocks

  # ---------- 프롬프트 ----------
  - name: promptarchive
    label: 프롬프트
    icon: save
    files:
      - name: prompts
        label: 프롬프트 창
        file: data/prompts.json
        fields:
          - { name: top_label, label: 맨 위 작은 라벨, widget: string, required: false, hint: '비워두면 안 나옵니다' }
          - { name: top_note, label: 라벨 옆 도트 글씨, widget: string, required: false }
          - { name: intro_heading, label: 소개글 소제목, widget: string, required: false }
          - { name: intro, label: 소개글, widget: text, required: false }
          - *blocks

  # ---------- 위젯 ----------
  - name: widgets
    label: 위젯
    icon: widgets
    files:
      - name: widgets
        label: 위젯 창
        file: data/widgets.json
        fields:
          - { name: top_label, label: 맨 위 작은 라벨, widget: string, required: false, hint: '비워두면 안 나옵니다' }
          - { name: top_note, label: 라벨 옆 도트 글씨, widget: string, required: false }
          - { name: intro_heading, label: 소개글 소제목, widget: string, required: false }
          - { name: intro, label: 소개글, widget: text, required: false }
          - *blocks

  # ---------- 방명록 안내 ----------
  - name: guest
    label: 방명록 안내
    icon: edit_note
    files:
      - name: guest
        label: 방명록 창 아래 내용
        file: data/guest.json
        fields:
          - { name: top_label, label: 맨 위 작은 라벨, widget: string, required: false, hint: '비워두면 안 나옵니다' }
          - { name: top_note, label: 라벨 옆 도트 글씨, widget: string, required: false }
          - { name: intro_heading, label: 소개글 소제목, widget: string, required: false }
          - { name: intro, label: 소개글, widget: text, required: false }
          - *blocks
